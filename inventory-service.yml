datasource:
  url: jdbc:h2:mem:inventory-db
  driver-class-name: org.h2.Driver
  username: sa
  password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    rest:
      base-path: /api


management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8082