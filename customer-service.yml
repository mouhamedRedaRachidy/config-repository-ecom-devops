datasource:
  url: jdbc:h2:mem:customer-db
  driver-class-name: org.h2.Driver
  username: sa
  password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    rest:
      base-path: /api

  h2:
    console:
      enabled: true
      path: /h2-console


management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8081

