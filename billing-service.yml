datasource:
  url: jdbc:h2:mem:billing-db
  driver-class-name: org.h2.Driver
  username: sa
  password:

jpa:
  database-platform: org.hibernate.dialect.H2Dialect
  hibernate:
    ddl-auto: update
  show-sql: true

h2:
  console:
    enabled: true
    path: /h2-console

cloud:
  config:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8083